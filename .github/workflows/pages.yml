# Kataloğu doğrular; admin/ klasörünü, uygulama görsellerini (media/), katalog şemasını ve
# indirme istatistiklerini (stats.json) GitHub Pages'e yayınlar.
# İlk kullanımda: Repo → Settings → Pages → Source: "GitHub Actions" seçilmeli.
# İstatistikler 6 saatte bir yenilenir (GitHub, 60 gün hareketsiz repolarda zamanlanmış
# iş akışlarını durdurur; bir push yeniden başlatır).
name: Admin panelini yayınla

on:
  push:
    branches: [main]
    paths: ["admin/**", "catalog.json", "media/**", "schema/**", "tools/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first_try.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests jsonschema
      # Bozuk katalog yayına çıkmasın: hata varsa iş burada durur.
      - name: Kataloğu doğrula
        run: python tools/validate.py catalog.json
      - name: Siteyi hazırla
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp -r admin/. _site/
          cp -r schema _site/schema
          if [ -d media ]; then cp -r media _site/media; fi
          python tools/stats.py catalog.json _site/stats.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # GitHub ara sıra yeni yüklenen paketi hemen göremiyor ("No artifacts named
      # github-pages"); böyle olursa biraz bekleyip bir kez daha dener.
      - id: first_try
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.first_try.outcome == 'failure'
        run: sleep 30
      - id: deployment
        if: steps.first_try.outcome == 'failure'
        uses: actions/deploy-pages@v5
